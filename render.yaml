services:
  - type: web
    name: onye-ehr-intelligence
    runtime: python
    buildCommand: "pip install -r requirements.txt && cd frontend && npm install && npm run build"
    startCommand: "python -m backend.app.api.main"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.12.0
      - key: USE_LIGHTWEIGHT_EMBEDDINGS
        value: "1"
      - key: GEMINI_API_KEY
        sync: false

